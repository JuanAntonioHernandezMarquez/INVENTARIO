
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Inventario</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        input[type="text"] {
            text-transform: uppercase;
        }
    </style>
</head>

<body class="bg-gray-100 min-h-screen pb-10">

<header class="bg-indigo-600 text-white p-4 shadow">
    <div class="max-w-5xl mx-auto flex justify-between items-center">
        <h1 class="text-lg font-bold">
            <i class="fa-solid fa-barcode"></i> Control de Inventario
        </h1>
        <span id="counter" class="bg-indigo-800 px-3 py-1 rounded-full text-sm">
            0 registros
        </span>
    </div>
</header>

<main class="max-w-5xl mx-auto p-4 space-y-5">

    <!-- ESCÁNER -->
    <section class="bg-white rounded-xl shadow p-4">
        <h2 class="font-bold text-gray-700 mb-3">
            <i class="fa-solid fa-camera text-indigo-600"></i>
            Escáner de códigos
        </h2>

        <div class="flex flex-wrap gap-2 mb-3">
            <button onclick="scanIntoField('inventario')"
                class="bg-indigo-600 text-white rounded-lg px-4 py-2">
                <i class="fa-solid fa-camera"></i>
                Escanear SIAF
            </button>

            <button onclick="scanIntoField('serie')"
                class="bg-blue-600 text-white rounded-lg px-4 py-2">
                <i class="fa-solid fa-camera"></i>
                Escanear serie
            </button>

            <button onclick="toggleScanner()"
                id="btnToggleCam"
                class="bg-gray-700 text-white rounded-lg px-4 py-2">
                Iniciar cámara
            </button>
        </div>

        <div id="reader-container" class="hidden">
            <div id="reader" class="w-full"></div>
            <p class="text-sm text-gray-500 mt-2">
                Coloca el código dentro del recuadro de la cámara.
            </p>
        </div>

        <p id="scannerStatus" class="text-sm text-gray-600 mt-2">
            Puedes escanear o escribir los códigos manualmente.
        </p>
    </section>

    <!-- FORMULARIO -->
    <section class="bg-white rounded-xl shadow p-4">
        <h2 class="font-bold text-gray-700 mb-4">
            <i class="fa-solid fa-pen-to-square text-indigo-600"></i>
            Datos del equipo
        </h2>

        <form id="equipmentForm"
              class="grid grid-cols-1 md:grid-cols-2 gap-3">

            <div>
                <label class="block text-sm font-semibold mb-1">
                    Código de inventario (SIAF)
                </label>
                <input id="inventario" type="text" required
                    class="w-full border rounded-lg p-3"
                    placeholder="Escanea o escribe el SIAF">
            </div>

            <div>
                <label class="block text-sm font-semibold mb-1">
                    Número de serie
                </label>
                <input id="serie" type="text" required
                    class="w-full border rounded-lg p-3"
                    placeholder="Escanea o escribe la serie">
            </div>

            <div>
                <label class="block text-sm font-semibold mb-1">
                    Equipo
                </label>
                <input id="equipo" type="text" required
                    class="w-full border rounded-lg p-3"
                    placeholder="Ej. LAPTOP, PC">
            </div>

            <div>
                <label class="block text-sm font-semibold mb-1">
                    Marca
                </label>
                <input id="marca" type="text" required
                    class="w-full border rounded-lg p-3"
                    placeholder="Ej. HP, DELL">
            </div>

            <div>
                <label class="block text-sm font-semibold mb-1">
                    Modelo
                </label>
                <input id="modelo" type="text" required
                    class="w-full border rounded-lg p-3"
                    placeholder="Modelo del equipo">
            </div>

            <div>
                <label class="block text-sm font-semibold mb-1">
                    Puesto
                </label>
                <select id="puesto" required
                    class="w-full border rounded-lg p-3 bg-white">
                    <option value="">Selecciona un puesto</option>
                    <option>CAJA</option>
                    <option>BANQUERO</option>
                    <option>EJECUTIVO</option>
                    <option>GERENTE</option>
                    <option>ADMINISTRATIVO</option>
                    <option>OTRO</option>
                </select>
            </div>

            <div class="md:col-span-2">
                <button type="submit"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg p-3">
                    <i class="fa-solid fa-floppy-disk"></i>
                    Agregar a la tabla
                </button>
            </div>
        </form>
    </section>

    <!-- REGISTROS -->
    <section class="bg-white rounded-xl shadow p-4">
        <div class="flex flex-wrap justify-between items-center gap-3 mb-4">
            <h2 class="font-bold text-gray-700">
                Equipos registrados
            </h2>

            <div class="flex flex-wrap gap-2">
                <button onclick="exportToExcel()"
                    class="bg-green-600 text-white px-3 py-2 rounded-lg">
                    Exportar Excel
                </button>

                <button onclick="exportToTXT()"
                    class="bg-blue-600 text-white px-3 py-2 rounded-lg">
                    Exportar TXT
                </button>

                <button onclick="clearAllData()"
                    class="bg-red-600 text-white px-3 py-2 rounded-lg">
                    Limpiar todo
                </button>
            </div>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full text-sm text-left border-collapse">
                <thead class="bg-gray-100">
                    <tr>
                        <th class="p-2">c_Inventario</th>
                        <th class="p-2">c_Serie</th>
                        <th class="p-2">c_Equipo</th>
                        <th class="p-2">c_Marca</th>
                        <th class="p-2">c_Modelo</th>
                        <th class="p-2">Puesto</th>
                        <th class="p-2">Acciones</th>
                    </tr>
                </thead>
                <tbody id="inventoryTableBody"></tbody>
            </table>
        </div>

        <p id="emptyState" class="text-center text-gray-400 py-6">
            No hay equipos registrados todavía.
        </p>
    </section>

</main>

<script>
    let scanner = null;
    let isScanning = false;
    let targetField = "inventario";

    let inventory = JSON.parse(
        localStorage.getItem("inventory_data") || "[]"
    );

    // Convertir texto a mayúsculas
    document.querySelectorAll('input[type="text"]').forEach(input => {
        input.addEventListener("input", function () {
            this.value = this.value.toUpperCase();
        });
    });

    // Seleccionar el campo al que llegará el escaneo
    async function scanIntoField(fieldId) {
        targetField = fieldId;

        document.getElementById("scannerStatus").textContent =
            fieldId === "inventario"
                ? "Escaneando código de inventario (SIAF)..."
                : "Escaneando número de serie...";

        if (!isScanning) {
            await toggleScanner();
        }
    }

    // Iniciar o detener cámara
    async function toggleScanner() {
        const container = document.getElementById("reader-container");
        const button = document.getElementById("btnToggleCam");

        if (isScanning) {
            try {
                if (scanner) {
                    await scanner.stop();
                    scanner.clear();
                }
            } catch (e) {
                console.warn(e);
            }

            scanner = null;
            isScanning = false;
            container.classList.add("hidden");
            button.textContent = "Iniciar cámara";
            document.getElementById("scannerStatus").textContent =
                "Cámara detenida.";
            return;
        }

        if (!window.isSecureContext) {
            alert("Abre esta aplicación mediante HTTPS o localhost para usar la cámara.");
            return;
        }

        container.classList.remove("hidden");
        button.textContent = "Deteniendo...";

        try {
            scanner = new Html5Qrcode("reader");

            await scanner.start(
                { facingMode: "environment" },
                {
                    fps: 10,
                    qrbox: { width: 280, height: 120 }
                },
                decodedText => {
                    const input = document.getElementById(targetField);
                    input.value = decodedText.toUpperCase();
                    input.dispatchEvent(new Event("input", { bubbles: true }));

                    document.getElementById("scannerStatus").textContent =
                        "Código capturado correctamente.";

                    if (navigator.vibrate) navigator.vibrate(150);

                    // Detener cámara después de capturar un código
                    toggleScanner();
                },
                () => {}
            );

            isScanning = true;
            button.textContent = "Detener cámara";
        } catch (error) {
            scanner = null;
            isScanning = false;
            container.classList.add("hidden");
            button.textContent = "Iniciar cámara";

            alert(
                "No se pudo abrir la cámara. Permite el acceso en el navegador y utiliza HTTPS o localhost."
            );
            console.error(error);
        }
    }

    // Registrar equipo
    document.getElementById("equipmentForm").addEventListener("submit", event => {
        event.preventDefault();

        const item = {
            id: Date.now(),
            inventario: document.getElementById("inventario").value.trim().toUpperCase(),
            serie: document.getElementById("serie").value.trim().toUpperCase(),
            equipo: document.getElementById("equipo").value.trim().toUpperCase(),
            marca: document.getElementById("marca").value.trim().toUpperCase(),
            modelo: document.getElementById("modelo").value.trim().toUpperCase(),
            puesto: document.getElementById("puesto").value.trim().toUpperCase()
        };

        inventory.unshift(item);
        saveAndRefresh();
        event.target.reset();

        document.getElementById("scannerStatus").textContent =
            "Equipo agregado correctamente.";
    });

    // Guardar en el navegador
    function saveAndRefresh() {
        localStorage.setItem("inventory_data", JSON.stringify(inventory));
        renderTable();
    }

    // Mostrar registros
    function renderTable() {
        const tbody = document.getElementById("inventoryTableBody");
        const empty = document.getElementById("emptyState");

        document.getElementById("counter").textContent =
            inventory.length + " registros";

        tbody.replaceChildren();

        empty.style.display = inventory.length ? "none" : "block";

        inventory.forEach(item => {
            const tr = document.createElement("tr");
            tr.className = "border-b";

            const values = [
                item.inventario || item.siaf || "",
                item.serie || "",
                item.equipo || "",
                item.marca || "",
                item.modelo || "",
                item.puesto || ""
            ];

            values.forEach(value => {
                const td = document.createElement("td");
                td.className = "p-2";
                td.textContent = value || "---";
                tr.appendChild(td);
            });

            const action = document.createElement("td");
            action.className = "p-2";

            const button = document.createElement("button");
            button.textContent = "Eliminar";
            button.className = "bg-red-100 text-red-700 rounded px-2 py-1";
            button.onclick = () => deleteItem(item.id);

            action.appendChild(button);
            tr.appendChild(action);
            tbody.appendChild(tr);
        });
    }

    function deleteItem(id) {
        if (!confirm("¿Deseas eliminar este equipo?")) return;

        inventory = inventory.filter(item => item.id !== id);
        saveAndRefresh();
    }

    function clearAllData() {
        if (!confirm("¿Deseas borrar todo el inventario guardado?")) return;

        inventory = [];
        saveAndRefresh();
    }

    // Descargar archivo Excel compatible
    function exportToExcel() {
        if (!inventory.length) {
            alert("No hay datos para exportar.");
            return;
        }

        const headers = [
            "c_Inventario", "c_Serie", "c_Equipo",
            "c_Marca", "c_Modelo", "Puesto"
        ];

        const rows = inventory.map(item => [
            item.inventario || item.siaf || "",
            item.serie || "",
            item.equipo || "",
            item.marca || "",
            item.modelo || "",
            item.puesto || ""
        ]);

        const escapeHtml = value => String(value).replace(/[&<>"']/g, char => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        })[char]);

        const html = `
            <html>
            <head><meta charset="UTF-8"></head>
            <body>
                <table border="1">
                    <thead><tr>${headers.map(h => `<th>${h}</th>`).join("")}</tr></thead>
                    <tbody>
                        ${rows.map(row =>
                            `<tr>${row.map(value => `<td>${escapeHtml(value)}</td>`).join("")}</tr>`
                        ).join("")}
                    </tbody>
                </table>
            </body>
            </html>`;

        downloadFile(
            html,
            "inventario_equipos.xls",
            "application/vnd.ms-excel;charset=utf-8;"
        );
    }

    // Descargar archivo de texto
    function exportToTXT() {
        if (!inventory.length) {
            alert("No hay datos para exportar.");
            return;
        }

        let content = "c_Inventario\tc_Serie\tc_Equipo\tc_Marca\tc_Modelo\tPuesto\n";

        inventory.forEach(item => {
            content += [
                item.inventario || item.siaf || "",
                item.serie || "",
                item.equipo || "",
                item.marca || "",
                item.modelo || "",
                item.puesto || ""
            ].join("\t") + "\n";
        });

        downloadFile(content, "inventario_equipos.txt", "text/plain;charset=utf-8;");
    }

    function downloadFile(content, filename, type) {
        const blob = new Blob([content], { type });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");

        link.href = url;
        link.download = filename;
        link.click();

        URL.revokeObjectURL(url);
    }

    renderTable();
</script>

</body>
</html>
